name: Build, test and package (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BurhanNexus.Vaccinator.sln

      - name: Build
        run: dotnet build BurhanNexus.Vaccinator.sln -c Release --no-restore

      - name: Test (scheduling engine, database workflows, printing)
        run: dotnet test tests/BurhanNexus.Vaccinator.Tests/BurhanNexus.Vaccinator.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: UI test (every screen builds with data at 3 screen sizes)
        env:
          UI_SCREENSHOT_DIR: ${{ github.workspace }}\ui-screens
        run: dotnet test tests/BurhanNexus.Vaccinator.UiTests/BurhanNexus.Vaccinator.UiTests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Keep the rendered screens for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: ui-screens
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the rendered screens to the ui-screens branch (for review)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path ui-screens)) { exit 0 }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "screens"
          git worktree add --detach $tmp
          Push-Location $tmp
          git checkout --orphan ui-screens-tmp
          git rm -rf . -q
          Copy-Item "${{ github.workspace }}\ui-screens\*" . -Recurse
          git add -A
          git commit -q -m "UI screens from build ${{ github.run_number }}"
          git push -f origin HEAD:ui-screens
          Pop-Location

      - name: Publish Windows app (self-contained, single file)
        run: dotnet publish src/BurhanNexus.Vaccinator.Desktop/BurhanNexus.Vaccinator.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=1.0.${{ github.run_number }} -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Zip the portable app
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath BurhanNexus-Vaccinator-win-x64.zip
          Get-ChildItem publish | Select-Object Name, Length

      - name: Build Windows installer (Setup.exe)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\BurhanNexusVaccinator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Test the installer (silent install, check files, uninstall)
        if: steps.installer.outcome == 'success'
        shell: pwsh
        run: |
          $dir = "C:\bnv-install-test"
          $p = Start-Process -FilePath "installer\Output\BurhanNexus-Vaccinator-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          foreach ($f in @("BurhanNexus.Vaccinator.exe","LICENSE.txt","THIRD-PARTY-NOTICES.txt")) { if (-not (Test-Path "$dir\$f")) { throw "Missing after install: $f" } }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\BurhanNexus.Vaccinator.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\BurhanNexus.Vaccinator.exe") { throw "Program still present after uninstall." }
          Write-Host "Install and uninstall verified."

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("BurhanNexus-Vaccinator-win-x64.zip")
          if (Test-Path installer\Output\BurhanNexus-Vaccinator-Setup.exe) { $files += "installer\Output\BurhanNexus-Vaccinator-Setup.exe" }
          gh release create "build-${{ github.run_number }}" @files --title "Burhan Nexus Vaccinator – build ${{ github.run_number }}" --notes "Windows 10/11 x64. Download BurhanNexus-Vaccinator-Setup.exe and run it, or use the zip (portable)." --latest
